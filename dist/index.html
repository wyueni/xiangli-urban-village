<small>巷里 · 村务手账 ／ 序章</small>
<h1>我重生了。<br>这一世，我是城中村之王。</h1>
<p>上一世，我是被巷口那根破电线杆砸死的。倒下来的时候，我手里还拎着两份肠粉。最后听见的，是芳姨在身后喊我的小名。</p>
<p>“两份肠粉，照旧？”我猛地睁开眼。蒸笼冒着热气，那根杆子还立着。昨天留下的裂缝，从杆脚一直爬到那张招租广告底下。</p>
<p>芳姨拎起那两份肠粉，刚迈出摊子，我就一把拽住了她的围裙。“姨，帮我打个抢修电话。”我抄起两张长凳，横在巷口。她看了看我腰间那串村务室钥匙，笑了：“哟，老王，上任啦？”</p><p>上辈子，她喊我那一声，我没来得及应。这回我回过头：“哎，来了。”</p>
